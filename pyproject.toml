[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trmnl-dashboard"
version = "0.1.0"
description = "E-ink dashboard server for a Seeed Studio TRMNL device."
readme = "README.md"
requires-python = ">=3.12"

# Runtime deps are pinned so the dev Mac and the deploy box run the same code,
# which matters most for Pillow (the renderer is golden-tested at T03; a Pillow
# version bump can shift a pixel). httpx is the HTTP client for the adapters.
dependencies = [
    "Pillow==11.0.0",
    "httpx==0.28.1",
    # Google Calendar (T07): google-auth loads/refreshes the read-only OAuth
    # credential; google-auth-oauthlib runs the owner's one-time consent (and
    # pulls in `requests`, which google-auth's refresh transport uses). The
    # calendar events themselves are fetched over httpx, so the heavier
    # google-api-python-client discovery client is deliberately not a dependency.
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
include = ["trmnl*"]

# The renderer loads these at runtime via __file__ paths (DESIGN §3.1, T03), so
# they must ship with the package even on a non-editable install: the bundled
# IBM Plex fonts, their OFL licence, and the cold-start placeholder BMP.
[tool.setuptools.package-data]
"trmnl.render" = ["fonts/*.ttf", "fonts/*.txt", "startup.bmp"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import trmnl` works whether or not the
# package was installed (Docker installs it; a bare `pytest` locally still works).
pythonpath = ["."]
testpaths = ["tests"]
